<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AML Blockchain Monitor{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    body          { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: .4px; }
    .risk-LOW     { color: #198754; }
    .risk-MEDIUM  { color: #856404; }
    .risk-HIGH    { color: #dc3545; }
    .badge-LOW    { background-color: #198754; }
    .badge-MEDIUM { background-color: #ffc107; color: #212529; }
    .badge-HIGH   { background-color: #dc3545; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'index' %}">
      🔍 AML Blockchain Monitor
    </a>
  </div>
</nav>

<div class="container pb-5">

  {% if messages %}
    {% for message in messages %}
    <div class="alert alert-danger alert-dismissible" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
